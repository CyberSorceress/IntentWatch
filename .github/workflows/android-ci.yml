name: Android CI & Security Audit Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --continue

    - name: Assemble Debug APKs
      run: ./gradlew assembleDebug

    - name: Upload IntentWatch Analyzer APK
      uses: actions/upload-artifact@v4
      with:
        name: intentwatch-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Vulnerable Benchmark Target APK
      uses: actions/upload-artifact@v4
      with:
        name: vulnerable-bank-demo-apk
        path: vulnerableapp/build/outputs/apk/debug/vulnerableapp-debug.apk
